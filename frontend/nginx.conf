# nginx 설정 (Docker 프론트엔드 컨테이너용)
#  - React 빌드 결과(정적 파일) 제공
#  - /api/ 요청은 backend 컨테이너(FastAPI)로 전달 → 브라우저 입장에선 같은 주소라 CORS 문제 없음
server {
    listen 80;
    client_max_body_size 25m;  # 업로드 이미지 크기 제한 (백엔드 MAX_IMAGE_MB=20 보다 약간 크게)

    # React 라우터: 새로고침해도 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # API → FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
